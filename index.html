<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社区失物招领保管台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>社区失物招领保管台</h1>
      <p class="sub">拾获登记 · 暗号认领 · 到期移交总站</p>
    </div>
    <button id="resetBtn" type="button" class="btn ghost">重置演示数据</button>
  </header>

  <main>
    <section class="panel">
      <h2>认领登记</h2>
      <form id="claimForm" class="claim-form">
        <label>认领物品
          <select id="itemSelect" required></select>
        </label>
        <label>认领人称呼
          <input id="claimantName" type="text" required maxlength="20" placeholder="如：王女士">
        </label>
        <label>认领暗号
          <input id="passphrase" type="text" required placeholder="拾获登记时留存的暗号">
        </label>
        <label class="full">物品特征描述
          <textarea id="features" rows="3" required placeholder="请描述颜色、内容物、特殊标记等，供管理员核验"></textarea>
        </label>
        <button type="submit" class="btn primary">提交认领</button>
      </form>
      <p id="claimMsg" class="msg" hidden></p>
    </section>

    <section class="panel">
      <h2>物品档案</h2>
      <div id="itemsList" class="cards"></div>
    </section>
  </main>

  <script src="js/items.js"></script>
  <script src="js/claims.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
